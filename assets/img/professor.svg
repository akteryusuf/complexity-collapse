<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Placeholder portrait: drop a photo at assets/img/professor.jpg to replace">
  <defs>
    <radialGradient id="pg" cx="50%" cy="34%" r="72%">
      <stop offset="0%" stop-color="#1b2942"/>
      <stop offset="100%" stop-color="#0d1524"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#pg)"/>

  <!-- faint instrument grid, echoing the page ground -->
  <g stroke="#4fd4f5" stroke-width="1" opacity="0.10">
    <path d="M0 50h200M0 100h200M0 150h200M50 0v200M100 0v200M150 0v200"/>
  </g>

  <!-- funnel motif: the subject of the lecture, standing in for a face -->
  <g fill="none" stroke="#4fd4f5" opacity="0.55">
    <ellipse cx="100" cy="72" rx="46" ry="13" stroke-width="1.6"/>
    <ellipse cx="100" cy="94" rx="29" ry="8" stroke-width="1.2" opacity="0.75"/>
    <ellipse cx="100" cy="112" rx="14" ry="4" stroke-width="1.2" opacity="0.6"/>
    <path d="M54 72q22 40 42 54" stroke-width="1.6"/>
    <path d="M146 72q-22 40-42 54" stroke-width="1.6"/>
  </g>
  <circle cx="100" cy="128" r="4.5" fill="#ff2d6b"/>
  <ellipse cx="100" cy="128" rx="11" ry="3" fill="none" stroke="#ffb703" stroke-width="1.2" opacity="0.8"/>

  <text x="100" y="166" text-anchor="middle" fill="#ffb703"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="15" letter-spacing="2">K = 1/&#916;E</text>
  <text x="100" y="182" text-anchor="middle" fill="#64748f"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="8.5" letter-spacing="1.6">PORTRAIT PENDING</text>
</svg>
